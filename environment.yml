# Conda environment for gridfinity_build123d.
#
# An export of the environment this library is developed, tested and documented
# in on Windows, produced with `conda env export --no-builds`. Build strings are
# omitted so the file is not tied to one platform, but the pinned versions are
# the ones the library is known to work with.
#
#     conda env create -f environment.yml
#     conda activate b3dp312
#     pip install -e .
#
# Three adjustments were made to the raw export so that it can be recreated:
#   - the `prefix:` line, an absolute path on the machine it came from, is removed
#   - gridfinity_build123d itself is not listed; install it from this repository
#     with `pip install -e .` once the environment exists
#   - bd_warehouse is referenced by the git commit from pyproject.toml rather
#     than by its local development version string, which is not on PyPI
#
# This environment runs the library and builds the documentation. It does not
# include the test and lint tooling; see requirements.txt for that.
